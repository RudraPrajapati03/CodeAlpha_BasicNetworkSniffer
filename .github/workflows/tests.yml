name: Python checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r BasicNetworkSniffer/requirements.txt
      - name: Compile Python files
        run: python -m py_compile BasicNetworkSniffer/sniffer.py BasicNetworkSniffer/tests/test_sniffer.py
      - name: Run unit tests
        run: python -m unittest discover -s BasicNetworkSniffer/tests -v
